name: Refresh profile metrics

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/profile-stats.yml'
      - '.github/scripts/render_profile.py'
      - 'README.md'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/profile-stats.yml'
      - '.github/scripts/render_profile.py'
      - 'README.md'

permissions:
  contents: write

concurrency:
  group: profile-metrics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Render cards from GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python3 .github/scripts/render_profile.py

      - name: Validate generated SVGs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          expected = [
              'overview-card-light.svg',
              'overview-card-dark.svg',
              'streak-card-light.svg',
              'streak-card-dark.svg',
              'top-langs-light.svg',
              'top-langs-dark.svg',
              'contribution-grid-light.svg',
              'contribution-grid-dark.svg',
          ]

          for name in expected:
              path = Path('profile') / name
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f'Missing or empty card: {path}')
              text = path.read_text(encoding='utf-8')
              if 'NaN' in text or 'undefined' in text:
                  raise SystemExit(f'Invalid value in {path}')
              ET.parse(path)

          print('All profile SVGs are valid.')
          PY

      - name: Publish refreshed cards
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          git add -A profile

          if git diff --cached --quiet; then
            echo 'Profile metrics are already current.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh profile metrics [skip ci]'
          git push origin "HEAD:${TARGET_BRANCH}"
